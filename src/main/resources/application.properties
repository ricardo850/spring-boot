spring.application.name=demo
# Conexión a la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/usuarios
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update                     # otras: create, create-drop, validate, none
spring.jpa.show-sql=true                                 # muestra las consultas SQL en consola
spring.jpa.properties.hibernate.format_sql=true          # formatea el SQL para legibilidad
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false                            # opcional, mejora el manejo de sesiones

